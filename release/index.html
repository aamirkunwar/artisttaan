<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">Release | ARTISTTAAN</title>
  <meta name="description" id="meta-description" content=""/>
  <link rel="canonical" id="canonical-url" href="" />
  <meta property="og:type" content="music.song" />
  <meta property="og:site_name" content="ARTISTTAAN" />
  <meta property="og:url" id="og-url" content="" />
  <meta property="og:title" id="og-title" content="" />
  <meta property="og:description" id="og-description" content="" />
  <meta property="og:image" id="og-image" content="" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twitter-title" content="" />
  <meta name="twitter:description" id="twitter-description" content="" />
  <meta name="twitter:image" id="twitter-image" content="" />
  <link rel="icon" type="image/png" href="/assets/images/logo/logo-icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="application/ld+json" id="ld-json"></script>
  <style>
    :root {
      --bg: #ffffff;
      --bg-elevated: #f7f7f5;
      --bg-card: #f0f0ed;
      --border: #e5e5e5;
      --text: #0a0a0a;
      --text-secondary: #555555;
      --text-muted: #888888;
      --accent: #0a0a0a;
      --accent-hover: #222222;
      --radius: 8px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* ===== NAV ===== */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    nav.scrolled { border-bottom-color: var(--border); }
    .nav-logo img { height: 28px; width: auto; }
    .nav-links { display: flex; gap: 26px; }
    .nav-links a {
      font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-secondary);
      transition: color 0.15s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      padding: 100px 0 48px;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #f0f0ed 0%, var(--bg) 100%);
      z-index: 0;
    }
    .hero-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, var(--bg) 100%);
    }
    .hero-inner {
      position: relative; z-index: 1;
      max-width: 1100px; margin: 0 auto;
      padding: 0 32px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 40px;
      align-items: end;
    }
    .cover-wrap {
      position: relative;
      width: 280px; aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.06);
      background: #eee;
    }
    .cover-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .hero-meta { padding-bottom: 4px; }
    .type-badge {
      display: inline-block;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .hero-title {
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 12px;
      text-wrap: balance;
    }
    .hero-by {
      font-size: 18px; font-weight: 600;
      margin-bottom: 6px;
    }
    .hero-by a { color: var(--text); }
    .hero-by a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .hero-year {
      font-size: 14px; color: var(--text-secondary);
      margin-bottom: 22px;
    }
    .hero-actions {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 22px;
      border-radius: 999px;
      font-size: 14px; font-weight: 700;
      border: none; cursor: pointer;
      transition: transform 0.15s, background 0.15s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--accent); color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent; color: var(--text);
      border: 1px solid rgba(0,0,0,0.2);
    }
    .btn-secondary:hover { border-color: #0a0a0a; background: rgba(0,0,0,0.04); }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ===== MAIN LAYOUT ===== */
    .page {
      max-width: 1100px; margin: 0 auto;
      padding: 0 32px 80px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 48px;
      align-items: start;
    }
    .main-col { min-width: 0; }
    .side-col {
      position: sticky; top: 88px;
    }

    /* ===== SECTIONS ===== */
    .section {
      margin-bottom: 40px;
    }
    .section-title {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* Spotify embed */
    .embed-frame {
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-card);
      min-height: 152px;
    }
    .embed-frame iframe {
      width: 100%; height: 152px; border: 0; display: block;
    }

    /* Lyrics (Genius-like) */
    .lyrics-body {
      font-size: 17px;
      line-height: 1.85;
      color: var(--text);
      white-space: pre-line;
      max-width: 560px;
    }
    .lyrics-body .section-header {
      display: block;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin: 22px 0 8px;
      text-transform: uppercase;
    }
    .lyrics-body .section-header:first-child { margin-top: 0; }

    /* About */
    .about-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-secondary);
      max-width: 560px;
    }

    /* Credits */
    .credits-list {
      display: grid;
      gap: 10px;
    }
    .credit-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px;
      font-size: 14px;
    }
    .credit-role { color: var(--text-muted); font-weight: 500; }
    .credit-name { color: var(--text); font-weight: 600; }

    /* Video */
    .video-frame {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      aspect-ratio: 16/9;
    }
    .video-frame iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: 0;
    }
    .video-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 12px;
      font-size: 13px; font-weight: 600;
      color: var(--text-secondary);
    }
    .video-link:hover { color: var(--text); }

    /* Related */
    .related-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .related-item {
      display: flex; align-items: center; gap: 12px;
      padding: 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .related-item:hover { background: var(--bg-card); }
    .related-item img {
      width: 56px; height: 56px;
      object-fit: cover;
      border-radius: 4px;
      background: #1a1a1a;
      flex-shrink: 0;
    }
    .related-item strong {
      display: block;
      font-size: 14px; font-weight: 600;
      line-height: 1.3;
    }
    .related-item em {
      display: block;
      font-size: 12px; font-style: normal;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Side card */
    .side-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .side-card h3 {
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* More from artist link */
    .more-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 600;
      color: var(--text);
      margin-top: 8px;
    }
    .more-link:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* Empty / not found */
    .not-found {
      text-align: center;
      padding: 160px 20px;
      color: var(--text-muted);
      font-size: 15px;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px;
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1100px; margin: 0 auto;
    }
    footer p, footer a { font-size: 12px; color: var(--text-muted); }
    footer a:hover { color: var(--text); }

    /* Crumb */
    .crumb {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 20px;
      position: relative; z-index: 2;
    }
    .crumb:hover { color: var(--text); }

    /* Hidden by default until data fills */
    #lyrics-section, #credits-section, #video-section, #about-section { display: none; }
    #lyrics-section.has-content,
    #credits-section.has-content,
    #video-section.has-content,
    #about-section.has-content { display: block; }

    /* Responsive */
    @media (max-width: 900px) {
      .hero-inner { grid-template-columns: 200px 1fr; gap: 28px; }
      .cover-wrap { width: 200px; }
      .page { grid-template-columns: 1fr; gap: 36px; }
      .side-col { position: static; }
    }
    @media (max-width: 640px) {
      nav { padding: 0 16px; }
      .nav-links { gap: 16px; }
      .nav-links a { font-size: 11px; }
      .hero { padding: 84px 0 32px; }
      .hero-inner {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 0 16px;
        text-align: center;
      }
      .cover-wrap { width: 220px; margin: 0 auto; }
      .hero-actions { justify-content: center; }
      .page { padding: 0 16px 60px; }
      .hero-title { font-size: 28px; }
      footer { flex-direction: column; gap: 10px; text-align: center; padding: 24px 16px; }
      .credit-row { grid-template-columns: 90px 1fr; }
    }
  </style>
</head>
<body>
<nav id="main-nav">
  <a href="/" class="nav-logo"><img src="/assets/images/logo/logo-nav.png" alt="ARTISTTAAN"/></a>
  <div class="nav-links">
    <a href="/artists/">Artists</a>
    <a href="/releases/" class="active">Releases</a>
    <a href="/videos/">Videos</a>
    <a href="/culture/">Culture</a>
    <a href="/demos/">Submit Demo</a>
  </div>
</nav>

<div id="page-content">
  <!-- HERO -->
  <header class="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-inner">
      <div class="cover-wrap">
        <img id="rel-cover" src="" alt="" fetchpriority="high" width="280" height="280"/>
      </div>
      <div class="hero-meta">
        <a href="/releases/" class="crumb">← All Releases</a>
        <div class="type-badge" id="rel-type">Single</div>
        <h1 class="hero-title" id="rel-title"></h1>
        <p class="hero-by">By <span id="rel-artist"></span></p>
        <p class="hero-year" id="rel-year"></p>
        <div class="hero-actions" id="rel-listen">
          <!-- filled by JS / Worker -->
        </div>
      </div>
    </div>
  </header>

  <!-- BODY -->
  <div class="page">
    <div class="main-col">
      <!-- Spotify embed -->
      <div class="section" id="embed-section" style="display:none">
        <div class="embed-frame" id="rel-embed"></div>
      </div>

      <!-- Lyrics -->
      <section class="section" id="lyrics-section">
        <h2 class="section-title">Lyrics</h2>
        <div class="lyrics-body" id="lyrics-text"></div>
      </section>

      <!-- About -->
      <section class="section" id="about-section">
        <h2 class="section-title">About</h2>
        <p class="about-text" id="rel-about"></p>
      </section>

      <!-- Video -->
      <section class="section" id="video-section">
        <h2 class="section-title">Video</h2>
        <div id="rel-video"></div>
      </section>
    </div>

    <aside class="side-col">
      <!-- Credits -->
      <div class="side-card" id="credits-section">
        <h3>Credits</h3>
        <div class="credits-list" id="rel-credits"></div>
      </div>

      <!-- More from artist / related -->
      <div class="side-card" id="related-card" style="display:none">
        <h3 id="related-heading">More from ARTISTTAAN</h3>
        <div class="related-grid" id="related-list"></div>
      </div>

      <div id="rel-more" style="margin-top:8px">
        <!-- more-from-artist link injected here -->
      </div>
    </aside>
  </div>
</div>

<footer>
  <p>© 2026 ARTISTTAAN · All Rights Reserved</p>
  <a href="/">← Back to ARTISTTAAN</a>
</footer>

<script>
(function () {
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const releaseSlug = (pathParts[0] === 'release' && pathParts[1]) ? pathParts[1] : null;

  function slugify(s) {
    if (!s) return '';
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function assetPath(p) {
    if (!p) return '';
    return '/' + String(p).replace(/^\/+/, '');
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Format lyrics with [Section] headers like Genius
  function formatLyrics(raw) {
    if (!raw) return '';
    return String(raw)
      .replace(/\[([^\]]+)\]/g, '<span class="section-header">[$1]</span>')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      // restore the span we just escaped
      .replace(/&lt;span class="section-header"&gt;/g, '<span class="section-header">')
      .replace(/&lt;\/span&gt;/g, '</span>');
  }

  // Soft pastel tint for hero background (light theme)
  function tintFromTitle(title) {
    let h = 0;
    const s = String(title || '');
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    const hue = h % 360;
    return `hsl(${hue}, 18%, 94%)`;
  }

  function render(r, artists) {
    if (!r) {
      document.getElementById('page-content').innerHTML = '<p class="not-found">Release not found.</p>';
      return;
    }

    const year = r.year || '';
    const type = (r.type || 'Release');
    const typeLower = type.toLowerCase();
    const pageUrl = 'https://artisttaanmusic.com/release/' + slugify(r.title) + '/';
    const description = (r.description && r.description.trim())
      ? r.description.trim().slice(0, 160)
      : 'Stream "' + r.title + '" by ' + r.artist + ' (' + year + ') — a ' + typeLower + ' from ARTISTTAAN, India\'s hip-hop & indie music label.';
    const coverAbs = r.cover
      ? 'https://artisttaanmusic.com' + assetPath(r.cover)
      : 'https://artisttaanmusic.com/assets/images/logo/og-image.jpg';

    // Meta
    document.getElementById('page-title').textContent = r.title + ' by ' + r.artist + ' | ARTISTTAAN';
    document.getElementById('meta-description').content = description;
    document.getElementById('canonical-url').href = pageUrl;
    document.getElementById('og-url').content = pageUrl;
    document.getElementById('og-title').content = r.title + ' by ' + r.artist + ' | ARTISTTAAN';
    document.getElementById('og-description').content = description;
    document.getElementById('og-image').content = coverAbs;
    document.getElementById('twitter-title').content = r.title + ' by ' + r.artist + ' | ARTISTTAAN';
    document.getElementById('twitter-description').content = description;
    document.getElementById('twitter-image').content = coverAbs;

    // Hero tint
    const tint = tintFromTitle(r.title);
    document.getElementById('hero-bg').style.background =
      'linear-gradient(180deg, ' + tint + ' 0%, #ffffff 100%)';

    // Cover
    const coverEl = document.getElementById('rel-cover');
    if (r.cover) {
      coverEl.src = assetPath(r.cover);
      coverEl.alt = r.title + ' cover art';
    }

    // Type / title / artist / year
    document.getElementById('rel-type').textContent = type;
    document.getElementById('rel-title').textContent = r.title;
    document.getElementById('rel-year').textContent = year ? year + ' · ARTISTTAAN' : 'ARTISTTAAN';

    const artist = (artists || []).find(function (a) {
      if (r.artist_id) return a.id === r.artist_id;
      return a.name && r.artist && a.name.toLowerCase() === String(r.artist).toLowerCase();
    });

    const artistSpan = document.getElementById('rel-artist');
    if (artist) {
      artistSpan.innerHTML = '<a href="/artist/' + esc(artist.id) + '/">' + esc(r.artist) + '</a>';
    } else {
      artistSpan.textContent = r.artist || '';
    }

    // Listen buttons
    const listenEl = document.getElementById('rel-listen');
    let listenHtml = '';
    if (r.spotify_url && r.spotify_url !== '#' && /^https?:\/\//.test(r.spotify_url)) {
      listenHtml += '<a class="btn btn-primary" href="' + esc(r.spotify_url) + '" target="_blank" rel="noopener noreferrer">' +
        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>' +
        'Listen on Spotify</a>';
    }
    if (r.youtube_url) {
      listenHtml += '<a class="btn btn-secondary" href="' + esc(r.youtube_url) + '" target="_blank" rel="noopener noreferrer">Watch Video</a>';
    }
    listenEl.innerHTML = listenHtml;

    // Spotify embed
    if (r.spotify_embed && /^https?:\/\//.test(r.spotify_embed)) {
      const emb = document.getElementById('rel-embed');
      emb.innerHTML = '<iframe src="' + esc(r.spotify_embed) + '?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>';
      document.getElementById('embed-section').style.display = 'block';
    }

    // Lyrics
    if (r.lyrics && String(r.lyrics).trim()) {
      document.getElementById('lyrics-text').innerHTML = formatLyrics(r.lyrics.trim());
      document.getElementById('lyrics-section').classList.add('has-content');
    }

    // About
    const aboutEl = document.getElementById('rel-about');
    if (aboutEl.textContent.trim()) {
      // Worker already wrote it
      document.getElementById('about-section').classList.add('has-content');
    } else {
      const about = (r.description && r.description.trim())
        ? r.description.trim()
        : '"' + r.title + '" is a ' + typeLower + ' by ' + r.artist +
          (year ? ', released in ' + year : '') +
          ' via ARTISTTAAN — India\'s hip-hop & indie label.';
      aboutEl.textContent = about;
      document.getElementById('about-section').classList.add('has-content');
    }

    // Credits
    if (Array.isArray(r.credits) && r.credits.length) {
      const credHtml = r.credits
        .filter(function (c) { return c && c.role && c.name; })
        .map(function (c) {
          return '<div class="credit-row"><span class="credit-role">' + esc(c.role) + '</span><span class="credit-name">' + esc(c.name) + '</span></div>';
        }).join('');
      if (credHtml) {
        document.getElementById('rel-credits').innerHTML = credHtml;
        document.getElementById('credits-section').classList.add('has-content');
      }
    }

    // Video (Worker may already have filled #rel-video)
    const videoEl = document.getElementById('rel-video');
    if (r.youtube_url && !videoEl.innerHTML.trim()) {
      const m = String(r.youtube_url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
      if (m) {
        videoEl.innerHTML =
          '<div class="video-frame"><iframe src="https://www.youtube-nocookie.com/embed/' + m[1] +
          '" title="' + esc(r.title) + ' video" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>' +
          '<a class="video-link" href="https://www.youtube.com/watch?v=' + m[1] + '" target="_blank" rel="noopener noreferrer">Watch on YouTube →</a>';
        document.getElementById('video-section').classList.add('has-content');
      }
    } else if (videoEl.innerHTML.trim()) {
      document.getElementById('video-section').classList.add('has-content');
    }

    // More from artist
    const moreEl = document.getElementById('rel-more');
    if (artist && !moreEl.querySelector('[data-more-artist]')) {
      moreEl.innerHTML = '<a data-more-artist="1" class="more-link" href="/artist/' + esc(artist.id) + '/">More from ' + esc(r.artist) + ' →</a>';
    }
  }

  async function init() {
    // Prefer the data the Worker already embedded (avoids a second fetch of artists.json)
    if (window.__RELEASE_DATA__ && window.__RELEASE_DATA__.release) {
      render(window.__RELEASE_DATA__.release, window.__RELEASE_DATA__.artist ? [window.__RELEASE_DATA__.artist] : []);
      return;
    }

    if (!releaseSlug) {
      document.getElementById('page-content').innerHTML = '<p class="not-found">Release not found.</p>';
      return;
    }

    try {
      const res = await fetch('/assets/data/artists.json');
      const data = await res.json();
      const releases = data.releases || [];
      const artists = data.artists || [];
      const r = releases.find(function (x) { return slugify(x.title) === releaseSlug; });
      if (!r) {
        document.getElementById('page-content').innerHTML = '<p class="not-found">Release not found.</p>';
        return;
      }
      render(r, artists);
    } catch (e) {
      console.error(e);
      document.getElementById('page-content').innerHTML = '<p class="not-found">Could not load release.</p>';
    }
  }

  // Sticky nav border
  window.addEventListener('scroll', function () {
    document.getElementById('main-nav').classList.toggle('scrolled', window.scrollY > 8);
  }, { passive: true });

  init();
})();
</script>
</body>
</html>
