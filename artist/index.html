<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Artist | ARTISTTAAN</title>
  <meta name="description" id="meta-description" content="" />
  <link rel="icon" type="image/png" href="/assets/images/logo/logo-icon.png" />
  <link rel="canonical" id="canonical-url" href="" />
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="ARTISTTAAN" />
  <meta property="og:url" id="og-url" content="" />
  <meta property="og:image" id="og-image" content="" />
  <meta property="og:title" id="og-title" content="" />
  <meta property="og:description" id="og-description" content="" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twitter-title" content="" />
  <meta name="twitter:description" id="twitter-description" content="" />
  <meta name="twitter:image" id="twitter-image" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #fafaf8;
      --paper-tint: #f2f0e9;
      --ink: #16150f;
      --line: #e4e0d5;
      --mute: #8c8676;
      --gold: #a97a1f;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; }

    .display { font-family: 'Archivo Black', 'Inter', sans-serif; font-weight: 400; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px;
      background: rgba(250, 250, 248, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo { height: 24px; width: auto; }
    .nav-back {
      font-size: 13px; font-weight: 500; text-decoration: none; color: var(--mute);
      display: flex; align-items: center; gap: 6px; transition: color 0.2s;
    }
    .nav-back:hover { color: var(--ink); }
    .nav-back svg { transition: transform 0.2s; }
    .nav-back:hover svg { transform: translateX(-3px); }

    /* ── HERO ── */
    .hero {
      margin-top: 64px;
      max-width: 1320px; margin-left: auto; margin-right: auto;
      padding: 120px 48px 96px;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 64px;
      align-items: start;
    }
    .hero-eyebrow {
      font-size: 12px; color: var(--mute); margin-bottom: 28px;
      opacity: 0; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.05s;
    }
    .hero-name {
      font-size: clamp(48px, 6.4vw, 92px);
      font-weight: 400; letter-spacing: -0.01em; line-height: 0.98;
      margin-bottom: 28px;
      opacity: 0; animation: rise 0.8s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.12s;
    }
    .hero-role {
      font-size: 15px; color: var(--mute); margin-bottom: 32px;
      opacity: 0; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.2s;
    }
    .hero-bio {
      font-size: 16px; line-height: 1.8; color: #46443c;
      max-width: 480px; margin-bottom: 40px;
      opacity: 0; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.28s;
    }
    .hero-actions {
      display: flex; align-items: center; flex-wrap: wrap; gap: 22px; margin-bottom: 56px;
      opacity: 0; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.36s;
    }
    .btn-solid {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 28px; background: var(--ink); color: #fff;
      font-size: 13px; font-weight: 600;
      text-decoration: none; transition: opacity 0.2s;
    }
    .btn-solid:hover { opacity: 0.8; }
    .link-quiet {
      font-size: 13px; font-weight: 500; color: var(--mute);
      text-decoration: none; border-bottom: 1px solid transparent;
      padding-bottom: 2px; transition: all 0.2s;
    }
    .link-quiet:hover { color: var(--ink); border-color: var(--ink); }

    .hero-stats {
      display: flex; gap: 40px;
      opacity: 0; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.44s;
    }
    .hero-stat p:first-child {
      font-family: 'Archivo Black'; font-size: 26px; letter-spacing: -0.01em; line-height: 1;
    }
    .hero-stat p:last-child {
      font-size: 12px; color: var(--mute); margin-top: 6px;
    }

    .hero-portrait {
      position: relative;
      aspect-ratio: 4 / 5; overflow: hidden; background: #e5e2d8;
      opacity: 0; animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.18s;
    }
    .hero-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center top; filter: grayscale(1) contrast(1.05); display: block; }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    /* ── INDEX NAV ── */
    .indexnav {
      position: sticky; top: 64px; z-index: 90;
      background: var(--paper);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: flex; gap: 32px; padding: 0 48px;
    }
    .idx {
      padding: 18px 0; font-size: 13px; font-weight: 500; color: var(--mute);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      cursor: pointer; background: none; border-top: none; border-left: none; border-right: none;
      transition: color 0.2s;
    }
    .idx:hover { color: var(--ink); }
    .idx.active { color: var(--ink); border-bottom-color: var(--gold); }

    /* ── SECTIONS ── */
    .wrap { max-width: 1320px; margin: 0 auto; padding: 0 48px; }
    .section { padding: 96px 0; }
    .sec-title {
      font-family: 'Archivo Black'; font-size: clamp(26px, 2.6vw, 34px);
      font-weight: 400; letter-spacing: -0.01em; margin-bottom: 48px;
    }

    /* ── FEATURED RELEASE STRIP ── */
    .ls { position: relative; overflow: hidden; border: 1px solid var(--line); margin-bottom: 64px; }
    .ls-track { display: flex; transition: transform 0.5s cubic-bezier(.22,1,.36,1); }
    .ls-slide {
      flex: 0 0 100%; display: grid; grid-template-columns: 156px 1fr; gap: 32px;
      padding: 32px; align-items: center;
    }
    .ls-poster { width: 156px; height: 156px; overflow: hidden; background: #e5e2d8; flex-shrink: 0; }
    .ls-poster img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: filter 0.4s; }
    .ls-slide:hover .ls-poster img { filter: grayscale(0); }
    .ls-info { min-width: 0; }
    .ls-tag {
      font-size: 11px; font-weight: 600; color: var(--gold); display: block; margin-bottom: 10px;
    }
    .ls-title { font-family: 'Archivo Black'; font-size: clamp(19px, 2.2vw, 28px); font-weight: 400; letter-spacing: -0.01em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ls-year { font-size: 12px; color: var(--mute); margin-top: 6px; }
    .ls-actions { margin-top: 18px; }
    .ls-actions a {
      display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600;
      color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 2px;
    }
    .ls-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px;
      border-radius: 50%; background: var(--paper); border: 1px solid var(--line); color: var(--ink);
      cursor: pointer; font-size: 16px; line-height: 1; display: flex; align-items: center;
      justify-content: center; transition: border-color 0.2s; z-index: 2;
    }
    .ls-arrow:hover { border-color: var(--ink); }
    .ls-prev { left: 12px; }
    .ls-next { right: 12px; }
    .ls-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 2; }
    .ls-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line); cursor: pointer; transition: all 0.2s; }
    .ls-dot.active { background: var(--gold); width: 16px; border-radius: 3px; }
    @media (max-width: 600px) { .ls-slide { grid-template-columns: 1fr; padding: 24px; } .ls-poster { width: 100%; height: auto; aspect-ratio: 1; } }

    /* ── TRACKLIST ── */
    .tracklist { border-top: 1px solid var(--line); }
    .track-row {
      position: relative; display: flex; align-items: center; gap: 20px;
      padding: 20px 0; border-bottom: 1px solid var(--line);
      text-decoration: none; color: var(--ink);
    }
    .track-num { font-family: 'Archivo Black'; font-size: 13px; color: var(--mute); width: 32px; flex-shrink: 0; transition: color 0.2s; }
    .track-row:hover .track-num { color: var(--gold); }
    .track-title { flex: 1; font-size: 17px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: transform 0.25s; }
    .track-row:hover .track-title { transform: translateX(6px); }
    .track-year { font-size: 12px; color: var(--mute); width: 48px; flex-shrink: 0; }
    .track-cta { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--gold); opacity: 0; transition: opacity 0.2s; flex-shrink: 0; }
    .track-row:hover .track-cta { opacity: 1; }
    .track-thumb {
      position: absolute; right: 0; top: 50%; width: 68px; height: 68px;
      transform: translateY(-50%) translateX(16px) scale(0.94);
      opacity: 0; pointer-events: none; overflow: hidden; z-index: 3;
      transition: all 0.3s cubic-bezier(0.16,1,0.3,1); background: #e5e2d8;
      box-shadow: 0 10px 24px rgba(0,0,0,0.14);
    }
    .track-row:hover .track-thumb { opacity: 1; transform: translateY(-50%) translateX(0) scale(1); }
    .track-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .empty-note { font-size: 14px; color: var(--mute); padding: 20px 0; }

    /* ── ABOUT ── */
    #about { background: var(--paper-tint); }
    .about-grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 80px; align-items: start; }
    .about-photo { aspect-ratio: 3 / 4; overflow: hidden; background: #e5e2d8; }
    .about-photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
    .about-bio { font-size: 16px; line-height: 1.9; color: #46443c; margin-bottom: 36px; }
    .genre-tag {
      display: inline-block; padding: 6px 14px; border: 1px solid var(--line);
      font-size: 12px; color: var(--mute); margin: 0 8px 8px 0;
    }
    .platform-links { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 32px; }
    .platform-link { font-size: 13px; font-weight: 500; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); padding-bottom: 2px; transition: border-color 0.2s; }
    .platform-link:hover { border-color: var(--ink); }

    /* ── VIDEOS ── */
    .videos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
    .vid-label { font-size: 14px; font-weight: 500; margin-top: 14px; }
    .vid-frame { aspect-ratio: 16/9; overflow: hidden; background: #1a1a1a; }
    .vid-frame iframe { width: 100%; height: 100%; border: none; display: block; }
    .vid-card { position: relative; cursor: pointer; overflow: hidden; background: #1a1a1a; }
    .vid-thumb { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(0.4); transition: transform 0.6s cubic-bezier(0.16,1,0.3,1), filter 0.4s; }
    .vid-card:hover .vid-thumb { transform: scale(1.04); filter: grayscale(0) brightness(0.65); }
    .vid-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.88); width: 48px; height: 48px; border-radius: 50%; background: rgba(250,250,248,0.94); display: flex; align-items: center; justify-content: center; opacity: 0.92; transition: transform 0.3s, opacity 0.3s; }
    .vid-card:hover .vid-play-btn { transform: translate(-50%,-50%) scale(1); opacity: 1; }

    /* ── FOOTER ── */
    footer {
      background: var(--ink); color: #fff;
      padding: 48px; display: flex; align-items: center; justify-content: space-between;
    }
    footer p { font-size: 12px; color: #777; }
    footer a { font-size: 12px; color: #777; text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: #fff; }

    @media (max-width: 900px) {
      nav { padding: 0 24px; }
      .hero { grid-template-columns: 1fr; padding: 96px 24px 64px; gap: 40px; }
      .hero-portrait { max-width: 320px; }
      .indexnav { padding: 0 24px; gap: 24px; }
      .wrap { padding: 0 24px; }
      .section { padding: 64px 0; }
      .about-grid { grid-template-columns: 1fr; gap: 40px; }
      .about-photo { max-width: 320px; }
      .videos-grid { grid-template-columns: 1fr; }
      footer { flex-direction: column; gap: 12px; text-align: center; padding: 36px 24px; }
    }
    @media (max-width: 600px) {
      .track-thumb { display: none; }
      .track-cta { display: none; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/"><img class="nav-logo" src="/assets/images/logo/logo-nav.png" alt="ARTISTTAAN" /></a>
  <a href="/artists/" class="nav-back">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    All Artists
  </a>
</nav>

<div class="hero">
  <div>
    <p class="hero-eyebrow">ARTISTTAAN — <span id="hero-role"></span></p>
    <h1 class="hero-name display" id="hero-name"></h1>
    <p class="hero-role" id="hero-role2"></p>
    <p class="hero-bio" id="hero-bio"></p>
    <div class="hero-actions" id="hero-actions"></div>
    <div class="hero-stats" id="hero-stats"></div>
  </div>
  <div class="hero-portrait">
    <img id="hero-img" src="" alt="" />
  </div>
</div>

<div class="indexnav">
  <button class="idx active" data-target="music">Music</button>
  <button class="idx" data-target="about">About</button>
  <button class="idx" data-target="videos">Videos</button>
</div>

<div id="music">
  <div class="wrap">
    <div class="section">
      <h2 class="sec-title display" id="music-title">Music</h2>
      <div id="latest-release-panel"></div>
      <div class="tracklist" id="releases-grid"></div>
    </div>
  </div>
</div>

<div id="about">
  <div class="wrap">
    <div class="section">
      <div class="about-grid">
        <div class="about-photo">
          <img id="about-photo" src="" alt="" />
        </div>
        <div>
          <h2 class="sec-title display" id="about-title"></h2>
          <p class="about-bio" id="about-bio"></p>
          <div id="genres"></div>
          <div class="platform-links" id="platform-links"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="videos">
  <div class="wrap">
    <div class="section">
      <h2 class="sec-title display">Videos</h2>
      <div class="videos-grid" id="videos-grid"></div>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 ARTISTTAAN</p>
  <a href="/">← Back to ARTISTTAAN</a>
</footer>

<script>
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const pathSlug = (pathParts[0] === 'artist' && pathParts[1]) ? pathParts[1] : null;
  const artistId = new URLSearchParams(window.location.search).get('artist') || pathSlug;

  function assetPath(p) {
    if (!p) return '';
    return '/' + String(p).replace(/^\/+/, '');
  }

  function slugify(s) {
    if (!s) return '';
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  const artistVideos = {
    shrey: [{t:'Kaagaz Aur Daag',e:'https://www.youtube.com/embed/ZYln3iWRxDk'},{t:'Sifarishein',e:'https://www.youtube.com/embed/rcKlMq2uDlk'},{t:'Thoughts Are Poison',e:'https://www.youtube.com/embed/afRnyWvO6PU'},{t:'Thoda Aur',e:'https://www.youtube.com/embed/Q5E5t5VbVeo'}],
    abir: [{t:'Marz',e:'https://www.youtube.com/embed/U7AdDdqJWUg'},{t:'Kaho Na',e:'https://www.youtube.com/embed/lC9X-FtN7AI'}],
    slay: [{t:'Namaskar',e:'https://www.youtube.com/embed/bLTVqTJ1hUQ'}],
    apoorvv: [], faraz: []
  };

  async function init() {
    try {
      const res = await fetch('/assets/data/artists.json');
      const data = await res.json();
      const artist = data.artists.find(a => a.id === artistId);
      if (!artist) { document.body.innerHTML = '<p style="text-align:center;padding:160px 20px;font-size:14px;color:#8c8676;">Artist not found.</p>'; return; }
      render(artist, data.releases || []);
    } catch(e) { console.error(e); }
  }

  function render(a, allReleases) {
    document.getElementById('page-title').textContent = `${a.name} — ARTISTTAAN`;
    document.getElementById('meta-description').content = a.full_bio || a.bio;
    document.getElementById('og-title').content = `${a.name} | ARTISTTAAN`;
    document.getElementById('og-description').content = a.bio;
    document.getElementById('og-url').content = `https://artisttaanmusic.com/artist/${a.id}/`;
    document.getElementById('canonical-url').href = `https://artisttaanmusic.com/artist/${a.id}/`;
    document.getElementById('twitter-title').content = `${a.name} | ARTISTTAAN`;
    document.getElementById('twitter-description').content = a.bio;
    if (a.square_photo) {
      document.getElementById('og-image').content = `https://artisttaanmusic.com/${a.square_photo}`;
      document.getElementById('twitter-image').content = `https://artisttaanmusic.com/${a.square_photo}`;
    }

    document.getElementById('hero-role').textContent = a.role;
    document.getElementById('hero-role2').textContent = a.role;
    document.getElementById('hero-name').textContent = a.name;
    document.getElementById('hero-bio').textContent = a.bio;
    document.getElementById('hero-img').src = assetPath(a.banner || a.photo);
    document.getElementById('hero-img').alt = a.name;

    const acts = [];
    if (a.spotify_url) acts.push(`<a href="${a.spotify_url}" target="_blank" class="btn-solid">Listen on Spotify</a>`);
    if (a.apple_music_url) acts.push(`<a href="${a.apple_music_url}" target="_blank" class="link-quiet">Apple Music</a>`);
    if (a.instagram) acts.push(`<a href="${a.instagram}" target="_blank" class="link-quiet">Instagram</a>`);
    document.getElementById('hero-actions').innerHTML = acts.join('');

    const releases = allReleases.filter(r => r.artist_id === a.id);
    const stats = [];
    if (a.total_streams && a.total_streams !== '—') stats.push(`<div class="hero-stat"><p>${a.total_streams}</p><p>Total Streams</p></div>`);
    stats.push(`<div class="hero-stat"><p>${releases.length}</p><p>Releases</p></div>`);
    document.getElementById('hero-stats').innerHTML = stats.join('');

    const latestPanel = document.getElementById('latest-release-panel');
    const slides = releases.slice(0, 5);
    if (slides.length) {
      latestPanel.innerHTML = `
        <div class="ls" id="ls">
          <div class="ls-track" id="ls-track"></div>
          <button class="ls-arrow ls-prev" id="ls-prev" aria-label="Previous">&#8249;</button>
          <button class="ls-arrow ls-next" id="ls-next" aria-label="Next">&#8250;</button>
          <div class="ls-dots" id="ls-dots"></div>
        </div>`;
      const track = document.getElementById('ls-track');
      const dotsEl = document.getElementById('ls-dots');
      const prevBtn = document.getElementById('ls-prev');
      const nextBtn = document.getElementById('ls-next');
      track.innerHTML = slides.map((r, i) => `
        <div class="ls-slide">
          <div class="ls-poster"><img src="${assetPath(r.cover)}" alt="${r.title}" loading="lazy" /></div>
          <div class="ls-info">
            <span class="ls-tag">${i === 0 ? 'Latest Release' : 'Recent Release'}</span>
            <p class="ls-title display">${r.title}</p>
            <p class="ls-year">${r.year}</p>
            <div class="ls-actions"><a href="/release/${slugify(r.title)}/">View Release</a></div>
          </div>
        </div>`).join('');
      dotsEl.innerHTML = slides.map((_, i) => `<span class="ls-dot${i === 0 ? ' active' : ''}" data-i="${i}"></span>`).join('');
      const dots = [...dotsEl.children];
      let idx = 0, timer;
      function go(i) {
        idx = (i + slides.length) % slides.length;
        track.style.transform = `translateX(-${idx * 100}%)`;
        dots.forEach((d, j) => d.classList.toggle('active', j === idx));
      }
      function startTimer() { timer = setInterval(() => go(idx + 1), 5000); }
      function stopTimer() { clearInterval(timer); }
      prevBtn.addEventListener('click', () => { go(idx - 1); stopTimer(); startTimer(); });
      nextBtn.addEventListener('click', () => { go(idx + 1); stopTimer(); startTimer(); });
      dots.forEach(d => d.addEventListener('click', () => { go(+d.dataset.i); stopTimer(); startTimer(); }));
      const box = document.getElementById('ls');
      box.addEventListener('mouseenter', stopTimer);
      box.addEventListener('mouseleave', startTimer);
      if (slides.length < 2) { prevBtn.style.display = 'none'; nextBtn.style.display = 'none'; dotsEl.style.display = 'none'; }
      else { startTimer(); }
    } else {
      latestPanel.innerHTML = '';
    }

    document.getElementById('music-title').textContent = `${a.name}'s Music`;
    document.getElementById('releases-grid').innerHTML = releases.length
      ? releases.map((r, i) => `
        <a class="track-row" href="/release/${slugify(r.title)}/">
          <span class="track-num display">${String(i + 1).padStart(2, '0')}</span>
          <span class="track-title">${r.title}</span>
          <span class="track-year">${r.year}</span>
          <span class="track-cta">Listen
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
          </span>
          <div class="track-thumb"><img src="${assetPath(r.cover)}" alt="${r.title}" loading="lazy" /></div>
        </a>`).join('')
      : '<p class="empty-note">Releases coming soon.</p>';

    document.getElementById('about-title').textContent = a.name;
    document.getElementById('about-bio').textContent = a.full_bio || a.bio;
    document.getElementById('about-photo').src = assetPath(a.photo);
    document.getElementById('about-photo').alt = a.name;
    if (a.genres) document.getElementById('genres').innerHTML = a.genres.map(g => `<span class="genre-tag">${g}</span>`).join('');

    const plats = [];
    if (a.spotify_url) plats.push(`<a href="${a.spotify_url}" target="_blank" class="platform-link">Spotify</a>`);
    if (a.apple_music_url) plats.push(`<a href="${a.apple_music_url}" target="_blank" class="platform-link">Apple Music</a>`);
    if (a.youtube_url) plats.push(`<a href="${a.youtube_url}" target="_blank" class="platform-link">YouTube</a>`);
    if (a.instagram) plats.push(`<a href="${a.instagram}" target="_blank" class="platform-link">Instagram</a>`);
    document.getElementById('platform-links').innerHTML = plats.join('');

    const vids = artistVideos[a.id] || [];
    const playIconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="#16150f"><path d="M8 5v14l11-7z"/></svg>`;
    document.getElementById('videos-grid').innerHTML = vids.length
      ? vids.map(v => {
          const id = v.e.split('/embed/')[1];
          const thumb = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
          return `
        <div>
          <div class="vid-frame">
            <div class="vid-card" style="width:100%;height:100%;" data-embed="${v.e}">
              <img class="vid-thumb" src="${thumb}" alt="${v.t}" loading="lazy" />
              <div class="vid-play-btn">${playIconSvg}</div>
            </div>
          </div>
          <p class="vid-label">${v.t}</p>
        </div>`;
        }).join('')
      : '<p class="empty-note">Videos coming soon.</p>';
    document.querySelectorAll('.vid-card').forEach(el => {
      el.addEventListener('click', () => {
        const embed = el.getAttribute('data-embed');
        el.innerHTML = `<iframe src="${embed}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:none;display:block;"></iframe>`;
        el.style.cursor = 'default';
      }, { once: true });
    });
  }

  document.querySelectorAll('.idx').forEach(tab => {
    tab.addEventListener('click', () => {
      const el = document.getElementById(tab.dataset.target);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    });
  });
  const idxSections = ['music', 'about', 'videos'];
  window.addEventListener('scroll', () => {
    let cur = 'music';
    idxSections.forEach(id => {
      const el = document.getElementById(id);
      if (el && window.scrollY >= el.offsetTop - 140) cur = id;
    });
    document.querySelectorAll('.idx').forEach(t => t.classList.toggle('active', t.dataset.target === cur));
  });

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
