  <meta property="og:url" id="og-url" content="" />

  <meta property="og:title" id="og-title" content="" />

  <meta name="twitter:description" id="twitter-description" content="" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafaf8;
      --bg-elevated: #f3f2ed;
      --bg-card: #eceae3;
      --text: #0a0a0a;
      --text-secondary: #555;
      --text-muted: #999;
      --border: #e5e5e5;
      --radius: 12px;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
      background: rgba(250,250,248,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo img { height: 26px; width: auto; }
    .nav-back {
      font-size: 13px; font-weight: 500; color: var(--text-muted);
      display: inline-flex; align-items: center; gap: 6px;
      transition: color 0.15s;
    }
    .nav-back:hover { color: var(--text); }

    .hero {
      margin-top: 60px;
      padding: 48px 28px 40px;
      max-width: 1100px;
      margin-left: auto; margin-right: auto;
    }
    .hero-inner {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: center;
    }
    .hero-photo {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      background: var(--bg-card);
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    }
    .hero-photo img { width: 100%; height: 100%; object-fit: cover; }
    .hero-eyebrow {
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }
    .hero-name {
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 800; letter-spacing: -0.03em;
      line-height: 1.05; margin-bottom: 10px;
    }
    .hero-role {
      font-size: 16px; color: var(--text-secondary);
      margin-bottom: 14px;
    }
    .genre-tags {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 18px;
    }
    .genre-tag {
      padding: 5px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 500;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .hero-bio {
      font-size: 15px; line-height: 1.65;
      color: var(--text-secondary);
      max-width: 520px;
      margin-bottom: 22px;
    }
    .hero-actions {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 20px; border-radius: 999px;
      font-size: 14px; font-weight: 600;
      border: none; cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: #0a0a0a; color: #fff; }
    .btn-primary:hover { background: #222; }
    .btn-secondary {
      background: transparent; color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: #0a0a0a; }
    .btn svg { width: 16px; height: 16px; }
    .social-icons {
      display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center;
    }
    .social-icon {
      width: 44px; height: 44px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.15s;
    }
    .social-icon:hover {
      background: #0a0a0a; color: #fff; border-color: #0a0a0a;
      transform: translateY(-1px);
    }
    .social-icon svg { width: 20px; height: 20px; display: block; }
    .hero-actions .social-icon { width: 44px; height: 44px; }
    .hero-stats {
      display: flex; flex-wrap: wrap; gap: 28px;
    }
    .stat-item strong {
      display: block; font-size: 20px; font-weight: 700;
      letter-spacing: -0.02em;
    }
    .stat-item span {
      font-size: 12px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.04em;
    }

    .sec-nav {
      position: sticky; top: 60px; z-index: 50;
      background: rgba(250,250,248,0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
    }
    .sec-nav-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sec-nav-inner::-webkit-scrollbar { display: none; }
    .sec-nav-btn {
      flex: 0 0 auto;
      padding: 14px 16px;
      font-size: 13px; font-weight: 600;
      color: var(--text-muted);
      background: none; border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .sec-nav-btn:hover { color: var(--text); }
    .sec-nav-btn.active {
      color: var(--text);
      border-bottom-color: #0a0a0a;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 28px;
    }
    .section {
      padding: 56px 0;
      border-bottom: 1px solid var(--border);
    }
    .section:last-of-type { border-bottom: none; }
    .section-title {
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 16px; margin-bottom: 24px;
    }
    .section-head .section-title { margin-bottom: 0; }

    .featured {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 24px;
      padding: 20px;
      background: var(--bg-elevated);
      border-radius: var(--radius);
      margin-bottom: 40px;
      align-items: center;
    }
    .featured-cover {
      aspect-ratio: 1; border-radius: 10px; overflow: hidden;
      background: #111;
    }
    .featured-cover img { width: 100%; height: 100%; object-fit: cover; }
    .featured-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 8px;
    }
    .featured-title {
      font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .featured-meta {
      font-size: 13px; color: var(--text-secondary);
      margin-bottom: 14px;
    }
    .featured-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .discog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px 16px;
    }
    .discog-card { display: block; color: inherit; }
    .discog-cover {
      aspect-ratio: 1; border-radius: 8px; overflow: hidden;
      background: #111; margin-bottom: 10px;
      position: relative;
    }
    .discog-cover img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.35s;
    }
    .discog-card:hover .discog-cover img { transform: scale(1.04); }
    .discog-title {
      font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .discog-meta {
      font-size: 12px; color: var(--text-muted);
      margin-bottom: 4px;
    }
    .origin-badge {
      display: inline-block;
      padding: 2px 7px; font-size: 9px; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      border-radius: 2px; background: #f0f0ed; color: #666;
    }
    .origin-badge.external { background: #111; color: #fff; }

    .tracklist {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .track-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .track-row:last-child { border-bottom: none; }
    .track-row:hover { background: var(--bg-elevated); }
    .track-num {
      width: 20px; font-size: 12px; font-weight: 600;
      color: var(--text-muted); text-align: right; flex-shrink: 0;
    }
    .track-title {
      flex: 1; min-width: 0;
      font-size: 14px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-cta {
      font-size: 12px; font-weight: 600; color: var(--text-muted);
      flex-shrink: 0;
    }
    .track-row:hover .track-cta { color: var(--text); }

    .about-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: start;
    }
    .about-text {
      font-size: 15px; line-height: 1.8;
      color: var(--text-secondary);
      white-space: pre-wrap;
    }
    .about-side {
      display: flex; flex-direction: column; gap: 20px;
    }
    .side-card {
      background: var(--bg-elevated);
      border-radius: var(--radius);
      padding: 20px;
    }
    .side-card h3 {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 12px;
    }
    .city-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .city-tag {
      padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 500;
      background: #fff; border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .press-links {
      display: flex; flex-direction: column; gap: 10px;
    }
    .press-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 500;
      color: var(--text);
    }
    .press-link:hover { text-decoration: underline; }

    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .vid-card {
      border-radius: 10px; overflow: hidden;
      background: #111; cursor: pointer;
      position: relative; aspect-ratio: 16/9;
    }
    .vid-card img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0.9; transition: opacity 0.2s;
    }
    .vid-card:hover img { opacity: 1; }
    .vid-play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .vid-play span {
      width: 48px; height: 48px; border-radius: 50%;
      background: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .vid-play svg { width: 18px; height: 18px; margin-left: 2px; }
    .vid-label {
      font-size: 13px; font-weight: 500;
      margin-top: 10px;
    }
    .empty-note {
      font-size: 14px; color: var(--text-muted);
      padding: 24px 0;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 32px 28px;
      text-align: center;
      font-size: 13px; color: var(--text-muted);
    }
    footer a {
      display: inline-block; margin-top: 8px;
      font-weight: 500; color: var(--text-secondary);
    }
    footer a:hover { color: var(--text); }

    @media (max-width: 800px) {
      .hero-inner { grid-template-columns: 1fr; gap: 28px; text-align: center; }
      .hero-photo { max-width: 240px; margin: 0 auto; }
      .hero-bio { margin-left: auto; margin-right: auto; }
      .hero-actions, .genre-tags, .hero-stats { justify-content: center; }
      .featured { grid-template-columns: 120px 1fr; gap: 16px; }
      .about-grid { grid-template-columns: 1fr; }
      .discog-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      nav, .sec-nav { padding-left: 16px; padding-right: 16px; }
      .hero, .wrap, footer { padding-left: 16px; padding-right: 16px; }
      .hero { padding-top: 32px; }
      .featured { grid-template-columns: 1fr; }
      .featured-cover { max-width: 160px; }
    }
  </style>
</head>

<section id="music">

        </div>
      </div>
    </div>
  </div>

<section id="videos">

      <div class="videos-grid" id="videos-grid"></div>
    </div>
  </div>
</section>

<footer>

    youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.546 12 3.546 12 3.546s-7.505 0-9.377.504A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.504 9.376.504 9.376.504s7.505 0 9.377-.504a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>'
  };
  function socialBtn(href, icon, label) {
    return '<a class="social-icon" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" title="' + esc(label) + '" aria-label="' + esc(label) + '">' + icon + '</a>';
  }

  async function init() {
    try {
      const res = await fetch('/assets/data/artists.json');
      const data = await res.json();
      const artist = (data.artists || []).find(function (a) { return a.id === artistId; });
      if (!artist) {
        document.body.innerHTML = '<p style="text-align:center;padding:160px 20px;font-size:14px;color:#999;">Artist not found.</p>';
        return;
      }
      render(artist, data.releases || []);
    } catch (e) {
      console.error(e);
    }
  }

  function artistReleases(allReleases, a) {
    const seen = {};
    return allReleases.filter(function (r) {
      const ids = String(r.artist_id || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      const nameMatch = (r.artist || '').toLowerCase().includes((a.name || '').toLowerCase());
      const mine = ids.length ? ids.indexOf(a.id) !== -1 : nameMatch;
      const s = slugify(r.title);
      if (!mine || !s || seen[s]) return false;
      seen[s] = true;
      return true;
    }).sort(function (x, y) {
      return (parseInt(y.year, 10) || 0) - (parseInt(x.year, 10) || 0);
    });
  }

  function render(a, allReleases) {
    const releases = artistReleases(allReleases, a);
    const pageUrl = 'https://artisttaanmusic.com/artist/' + encodeURIComponent(a.id) + '/';
    const photo = assetPath(a.photo || a.square_photo || a.banner);
    const desc = (a.bio || a.full_bio || '').trim().slice(0, 160) ||
      (a.name + ' — ARTISTTAAN artist.');

    document.getElementById('page-title').textContent = a.name + ' | ARTISTTAAN';
    document.getElementById('meta-description').content = desc;
    document.getElementById('canonical-url').href = pageUrl;
    document.getElementById('og-url').content = pageUrl;
    document.getElementById('og-title').content = a.name + ' | ARTISTTAAN';
    document.getElementById('og-description').content = desc;
    document.getElementById('og-image').content = photo ? ('https://artisttaanmusic.com' + photo) : 'https://artisttaanmusic.com/assets/images/logo/og-image.jpg';
    document.getElementById('twitter-title').content = a.name + ' | ARTISTTAAN';
    document.getElementById('twitter-description').content = desc;
    document.getElementById('twitter-image').content = document.getElementById('og-image').content;

    try {
      document.getElementById('ld-json').textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": a.name,
        "url": pageUrl,
        "image": photo ? ('https://artisttaanmusic.com' + photo) : undefined,
        "description": desc,
        "genre": a.genres || undefined
      });
    } catch (e) {}

    document.getElementById('hero-name').textContent = a.name || '';
    document.getElementById('hero-role').textContent = a.role || '';
    document.getElementById('hero-bio').textContent = a.bio || '';
    const img = document.getElementById('hero-img');
    if (photo) { img.src = photo; img.alt = a.name; }

    if (Array.isArray(a.genres) && a.genres.length) {
      const g = document.getElementById('hero-genres');
      g.innerHTML = a.genres.map(function (x) {
        return '<span class="genre-tag">' + esc(x) + '</span>';
      }).join('');
      g.style.display = 'flex';
    }

    var actions = '<div class="social-icons">';
    if (a.spotify_url) actions += socialBtn(a.spotify_url, ICONS.spotify, 'Spotify');
    if (a.apple_music_url) actions += socialBtn(a.apple_music_url, ICONS.apple, 'Apple Music');
    if (a.youtube_url || a.youtube) actions += socialBtn(a.youtube_url || a.youtube, ICONS.youtube, 'YouTube');
    if (a.instagram) actions += socialBtn(a.instagram, ICONS.instagram, 'Instagram');
    actions += '</div>';
    document.getElementById('hero-actions').innerHTML = actions;

    document.getElementById('hero-stats').innerHTML = '';
    document.getElementById('hero-stats').style.display = 'none';

    var feat = document.getElementById('featured-release');
    if (releases.length) {
      var r0 = releases[0];
      var type = (r0.type || 'Release');
      feat.innerHTML =
        '<a class="featured" href="/release/' + slugify(r0.title) + '/">' +
          '<div class="featured-cover"><img src="' + esc(assetPath(r0.cover)) + '" alt="' + esc(r0.title) + '" loading="lazy"/></div>' +
          '<div>' +
            '<p class="featured-label">Latest release</p>' +
            '<p class="featured-title">' + esc(r0.title) + '</p>' +
            '<p class="featured-meta">' + esc(type) + ' · ' + esc(r0.year || '') + '</p>' +
            '<div class="featured-actions"><span class="btn btn-secondary" style="padding:8px 14px;font-size:12px;">View release</span></div>' +
          '</div>' +
        '</a>';
    }

    var grid = document.getElementById('releases-grid');
    if (!releases.length) {
      document.getElementById('releases-empty').style.display = 'block';
      grid.innerHTML = '';
    } else {
      grid.innerHTML = releases.map(function (r) {
        var ext = isExternalRelease(r);
        var badge = ext
          ? '<span class="origin-badge external">Outside</span>'
          : '<span class="origin-badge">ARTISTTAAN</span>';
        return (
          '<a class="discog-card" href="/release/' + slugify(r.title) + '/">' +
            '<div class="discog-cover"><img src="' + esc(assetPath(r.cover)) + '" alt="' + esc(r.title) + '" loading="lazy"/></div>' +
            '<p class="discog-title">' + esc(r.title) + '</p>' +
            '<p class="discog-meta">' + esc(r.type || 'Release') + ' · ' + esc(r.year || '') + '</p>' +
            badge +
          '</a>'
        );
      }).join('');
    }

    var tracks = Array.isArray(a.top_tracks) ? a.top_tracks.filter(function (t) { return t && t.name; }) : [];
    if (tracks.length) {
      document.getElementById('top-tracks-block').style.display = 'block';
      document.getElementById('top-tracks-list').innerHTML = tracks.map(function (t, i) {
        var row =
          '<span class="track-num">' + (i + 1) + '</span>' +
          '<span class="track-title">' + esc(t.name) + '</span>' +
          (t.url ? '<span class="track-cta">Play →</span>' : '');
        if (t.url) {
          return '<a class="track-row" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer">' + row + '</a>';
        }
        return '<div class="track-row">' + row + '</div>';
      }).join('');
    }

    document.getElementById('about-bio').textContent = a.full_bio || a.bio || '';

    var plats = '';
    if (a.spotify_url) plats += socialBtn(a.spotify_url, ICONS.spotify, 'Spotify');
    if (a.apple_music_url) plats += socialBtn(a.apple_music_url, ICONS.apple, 'Apple Music');
    if (a.youtube_url || a.youtube) plats += socialBtn(a.youtube_url || a.youtube, ICONS.youtube, 'YouTube');
    if (a.instagram) plats += socialBtn(a.instagram, ICONS.instagram, 'Instagram');
    if (plats) {
      document.getElementById('platforms-card').style.display = 'block';
      document.getElementById('platform-links').innerHTML = plats;
    }

    var vids = artistVideos[a.id] || [];
    var vg = document.getElementById('videos-grid');
    if (!vids.length) {
      vg.innerHTML = '<p class="empty-note">Videos coming soon.</p>';
    } else {
      vg.innerHTML = vids.map(function (v) {
        var id = (v.e || '').split('/embed/')[1] || '';
        var thumb = id ? ('https://img.youtube.com/vi/' + id + '/hqdefault.jpg') : '';
        return (
          '<div>' +
            '<div class="vid-card" data-embed="' + esc(v.e) + '">' +
              (thumb ? '<img src="' + thumb + '" alt="' + esc(v.t) + '" loading="lazy"/>' : '') +
              '<div class="vid-play"><span><svg viewBox="0 0 24 24" fill="#0a0a0a"><path d="M8 5v14l11-7z"/></svg></span></div>' +
            '</div>' +
            '<p class="vid-label">' + esc(v.t) + '</p>' +
          '</div>'
        );
      }).join('');
      vg.querySelectorAll('.vid-card').forEach(function (el) {
        el.addEventListener('click', function () {
          var embed = el.getAttribute('data-embed');
          el.innerHTML = '<iframe src="' + embed + '?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:none;"></iframe>';
          el.style.cursor = 'default';
        }, { once: true });
      });
    }
  }

  document.querySelectorAll('.sec-nav-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var el = document.getElementById(btn.dataset.target);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  var sections = ['music', 'about', 'videos'];
  window.addEventListener('scroll', function () {
    var cur = 'music';
    sections.forEach(function (id) {
      var el = document.getElementById(id);
      if (el && window.scrollY >= el.offsetTop - 120) cur = id;
    });
    document.querySelectorAll('.sec-nav-btn').forEach(function (t) {
      t.classList.toggle('active', t.dataset.target === cur);
    });
  });

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
