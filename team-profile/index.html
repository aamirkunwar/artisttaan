<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Team | ARTISTTAAN</title>
  <meta name="description" id="meta-description" content="" />
  <link rel="icon" type="image/png" href="/assets/images/logo/logo-icon.png" />
  <link rel="canonical" id="canonical-url" href="" />
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="ARTISTTAAN" />
  <meta property="og:url" id="og-url" content="" />
  <meta property="og:image" id="og-image" content="" />
  <meta property="og:title" id="og-title" content="" />
  <meta property="og:description" id="og-description" content="" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twitter-title" content="" />
  <meta name="twitter:description" id="twitter-description" content="" />
  <meta name="twitter:image" id="twitter-image" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #fafaf8;
      --paper-tint: #f2f0e9;
      --ink: #16150f;
      --line: #e4e0d5;
      --mute: #8c8676;
      --gold: #a97a1f;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; }

    .display { font-family: 'Archivo Black', 'Inter', sans-serif; font-weight: 400; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px;
      background: rgba(250, 250, 248, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo { height: 24px; width: auto; }
    .nav-back {
      font-size: 13px; font-weight: 500; text-decoration: none; color: var(--mute);
      display: flex; align-items: center; gap: 6px; transition: color 0.2s;
    }
    .nav-back:hover { color: var(--ink); }
    .nav-back svg { transition: transform 0.2s; }
    .nav-back:hover svg { transform: translateX(-3px); }

    /* ── HERO ── */
    .hero {
      margin-top: 64px;
      max-width: 1320px; margin-left: auto; margin-right: auto;
      padding: 120px 48px 96px;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 64px;
      align-items: start;
    }
    .hero-eyebrow {
      font-size: 12px; color: var(--mute); margin-bottom: 28px;
      opacity: 0; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.05s;
    }
    .hero-name {
      font-size: clamp(48px, 6.4vw, 92px);
      font-weight: 400; letter-spacing: -0.01em; line-height: 0.98;
      margin-bottom: 20px;
      opacity: 0; animation: rise 0.8s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.12s;
    }
    .hero-role-line {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px;
      font-size: 15px; color: var(--mute); margin-bottom: 32px;
      opacity: 0; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.2s;
    }
    .hero-role-line .dot-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--mute); flex-shrink: 0; }
    .hero-location { display: inline-flex; align-items: center; gap: 6px; }
    .hero-location svg { flex-shrink: 0; }
    .hero-bio {
      font-size: 16px; line-height: 1.8; color: #46443c;
      max-width: 480px; margin-bottom: 40px;
      opacity: 0; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.28s;
    }
    .hero-actions {
      display: flex; align-items: center; flex-wrap: wrap; gap: 22px; margin-bottom: 56px;
      opacity: 0; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.36s;
    }
    .btn-solid {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 28px; background: var(--ink); color: #fff;
      font-size: 13px; font-weight: 600;
      text-decoration: none; transition: opacity 0.2s;
    }
    .btn-solid:hover { opacity: 0.8; }
    .link-quiet {
      font-size: 13px; font-weight: 500; color: var(--mute);
      text-decoration: none; border-bottom: 1px solid transparent;
      padding-bottom: 2px; transition: all 0.2s;
    }
    .link-quiet:hover { color: var(--ink); border-color: var(--ink); }

    .hero-stats {
      display: flex; gap: 40px;
      opacity: 0; animation: rise 0.7s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.44s;
    }
    .hero-stat p:first-child {
      font-family: 'Archivo Black'; font-size: 26px; letter-spacing: -0.01em; line-height: 1;
    }
    .hero-stat p:last-child {
      font-size: 12px; color: var(--mute); margin-top: 6px;
    }

    .hero-portrait {
      position: relative;
      aspect-ratio: 4 / 5; overflow: hidden; background: #e5e2d8;
      opacity: 0; animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) forwards; animation-delay: 0.18s;
    }
    .hero-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center top; filter: grayscale(1) contrast(1.05); display: block; }
    .hero-avatar {
      position: absolute; left: 20px; bottom: 20px;
      width: 84px; height: 84px; border-radius: 50%; overflow: hidden;
      border: 3px solid var(--paper); box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      background: #e5e2d8;
    }
    .hero-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    /* ── INDEX NAV ── */
    .indexnav {
      position: sticky; top: 64px; z-index: 90;
      background: var(--paper);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: flex; gap: 32px; padding: 0 48px;
    }
    .idx {
      padding: 18px 0; font-size: 13px; font-weight: 500; color: var(--mute);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      cursor: pointer; background: none; border-top: none; border-left: none; border-right: none;
      transition: color 0.2s;
    }
    .idx:hover { color: var(--ink); }
    .idx.active { color: var(--ink); border-bottom-color: var(--gold); }

    /* ── SECTIONS ── */
    .wrap { max-width: 1320px; margin: 0 auto; padding: 0 48px; }
    .section { padding: 96px 0; }
    .sec-title {
      font-family: 'Archivo Black'; font-size: clamp(26px, 2.6vw, 34px);
      font-weight: 400; letter-spacing: -0.01em; margin-bottom: 48px;
    }
    .empty-note { font-size: 14px; color: var(--mute); padding: 20px 0; }

    /* ── PROJECTS (WORK) ── */
    .projects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px 40px; }
    .project-card { display: block; text-decoration: none; color: var(--ink); }
    .project-frame { aspect-ratio: 16/9; overflow: hidden; background: #1a1a1a; }
    .project-frame iframe { width: 100%; height: 100%; border: none; display: block; }
    .vid-card { position: relative; width: 100%; height: 100%; cursor: pointer; overflow: hidden; background: #1a1a1a; }
    .vid-card.no-video { cursor: default; }
    .vid-thumb { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(0.4); transition: transform 0.6s cubic-bezier(0.16,1,0.3,1), filter 0.4s; }
    .vid-card:hover .vid-thumb { transform: scale(1.04); filter: grayscale(0) brightness(0.65); }
    .vid-card.no-video:hover .vid-thumb { transform: none; filter: grayscale(0.15) brightness(0.9); }
    .vid-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.88); width: 48px; height: 48px; border-radius: 50%; background: rgba(250,250,248,0.94); display: flex; align-items: center; justify-content: center; opacity: 0.92; transition: transform 0.3s, opacity 0.3s; }
    .vid-card:hover .vid-play-btn { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    .project-meta { margin-top: 16px; }
    .project-title { font-size: 19px; letter-spacing: -0.01em; }
    .project-sub { font-size: 12px; color: var(--gold); font-weight: 600; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
    .project-desc { font-size: 14px; line-height: 1.7; color: #5a5748; margin-top: 10px; }
    .project-link-cta { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink); margin-top: 10px; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }

    /* ── ABOUT ── */
    #about { background: var(--paper-tint); }
    .about-grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 80px; align-items: start; }
    .about-photo { aspect-ratio: 3 / 4; overflow: hidden; background: #e5e2d8; }
    .about-photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
    .about-bio { font-size: 16px; line-height: 1.9; color: #46443c; margin-bottom: 28px; white-space: pre-line; }
    .about-location-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); margin-bottom: 28px; }
    .platform-links { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 8px; }
    .platform-link { font-size: 13px; font-weight: 500; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); padding-bottom: 2px; transition: border-color 0.2s; }
    .platform-link:hover { border-color: var(--ink); }

    /* ── GALLERY ── */
    .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 56px; }
    .gallery-item { aspect-ratio: 1; overflow: hidden; background: #e5e2d8; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: filter 0.4s, transform 0.5s; display: block; }
    .gallery-item:hover img { filter: grayscale(0); transform: scale(1.05); }

    /* ── FOOTER ── */
    footer {
      background: var(--ink); color: #fff;
      padding: 48px; display: flex; align-items: center; justify-content: space-between;
    }
    footer p { font-size: 12px; color: #777; }
    footer a { font-size: 12px; color: #777; text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: #fff; }

    @media (max-width: 900px) {
      nav { padding: 0 24px; }
      .hero { grid-template-columns: 1fr; padding: 96px 24px 64px; gap: 40px; }
      .hero-portrait { max-width: 320px; }
      .indexnav { padding: 0 24px; gap: 24px; }
      .wrap { padding: 0 24px; }
      .section { padding: 64px 0; }
      .about-grid { grid-template-columns: 1fr; gap: 40px; }
      .about-photo { max-width: 320px; }
      .projects-grid { grid-template-columns: 1fr; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      footer { flex-direction: column; gap: 12px; text-align: center; padding: 36px 24px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/"><img class="nav-logo" src="/assets/images/logo/logo-nav.png" alt="ARTISTTAAN" /></a>
  <a href="/team/" class="nav-back">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Our Team
  </a>
</nav>

<div class="hero">
  <div>
    <p class="hero-eyebrow">ARTISTTAAN — Team</p>
    <h1 class="hero-name display" id="hero-name"></h1>
    <div class="hero-role-line">
      <span id="hero-role"></span>
      <span class="dot-sep" id="hero-sep" style="display:none;"></span>
      <span class="hero-location" id="hero-location" style="display:none;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-7-6.1-7-11a7 7 0 1114 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="hero-location-text"></span>
      </span>
    </div>
    <p class="hero-bio" id="hero-bio"></p>
    <div class="hero-actions" id="hero-actions"></div>
    <div class="hero-stats" id="hero-stats"></div>
  </div>
  <div class="hero-portrait">
    <img id="hero-img" src="" alt="" />
    <div class="hero-avatar" id="hero-avatar-wrap" style="display:none;">
      <img id="hero-avatar" src="" alt="" />
    </div>
  </div>
</div>

<div class="indexnav">
  <button class="idx active" data-target="work">Work</button>
  <button class="idx" data-target="about">About</button>
</div>

<div id="work">
  <div class="wrap">
    <div class="section">
      <h2 class="sec-title display" id="work-title">Selected Work</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </div>
</div>

<div id="about">
  <div class="wrap">
    <div class="section">
      <div class="about-grid">
        <div class="about-photo">
          <img id="about-photo" src="" alt="" />
        </div>
        <div>
          <h2 class="sec-title display" id="about-title"></h2>
          <div class="about-location-row" id="about-location-row" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-7-6.1-7-11a7 7 0 1114 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span id="about-location-text"></span>
          </div>
          <p class="about-bio" id="about-bio"></p>
          <div class="platform-links" id="platform-links"></div>
        </div>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 ARTISTTAAN</p>
  <a href="/">← Back to ARTISTTAAN</a>
</footer>

<script>
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const pathSlug = (pathParts[0] === 'team' && pathParts[1]) ? pathParts[1] : null;
  const memberId = new URLSearchParams(window.location.search).get('member') || pathSlug;

  function assetPath(p) {
    if (!p) return '';
    return '/' + String(p).replace(/^\/+/, '');
  }

  async function init() {
    try {
      const res = await fetch('/assets/data/artists.json');
      const data = await res.json();
      const member = (data.team || []).find(m => m.id === memberId);
      if (!member) { document.body.innerHTML = '<p style="text-align:center;padding:160px 20px;font-size:14px;color:#8c8676;">Team member not found.</p>'; return; }
      render(member);
    } catch (e) { console.error(e); }
  }

  function render(m) {
    document.getElementById('page-title').textContent = `${m.name} — ARTISTTAAN`;
    document.getElementById('meta-description').content = m.full_bio || m.bio || '';
    document.getElementById('og-title').content = `${m.name} | ARTISTTAAN`;
    document.getElementById('og-description').content = m.bio || '';
    document.getElementById('og-url').content = `https://artisttaanmusic.com/team/${m.id}/`;
    document.getElementById('canonical-url').href = `https://artisttaanmusic.com/team/${m.id}/`;
    document.getElementById('twitter-title').content = `${m.name} | ARTISTTAAN`;
    document.getElementById('twitter-description').content = m.bio || '';
    const heroImage = m.cover || m.photo;
    if (heroImage) {
      document.getElementById('og-image').content = `https://artisttaanmusic.com${assetPath(heroImage)}`;
      document.getElementById('twitter-image').content = `https://artisttaanmusic.com${assetPath(heroImage)}`;
    }

    document.getElementById('hero-name').textContent = m.name;
    document.getElementById('hero-role').textContent = m.role || '';
    document.getElementById('hero-bio').textContent = m.bio || '';
    document.getElementById('hero-img').src = assetPath(m.cover || m.photo);
    document.getElementById('hero-img').alt = m.name;

    if (m.location) {
      document.getElementById('hero-sep').style.display = 'inline-block';
      document.getElementById('hero-location').style.display = 'inline-flex';
      document.getElementById('hero-location-text').textContent = m.location;
    }

    // Small circular avatar overlay on the cover -- only shown when a
    // separate cover image is set (otherwise the portrait IS the photo,
    // so a duplicate avatar over itself would look redundant).
    if (m.cover && m.photo) {
      document.getElementById('hero-avatar-wrap').style.display = 'block';
      document.getElementById('hero-avatar').src = assetPath(m.photo);
      document.getElementById('hero-avatar').alt = m.name;
    }

    const acts = [];
    if (m.instagram) acts.push(`<a href="${m.instagram}" target="_blank" rel="noopener noreferrer" class="btn-solid">Instagram</a>`);
    if (m.website) acts.push(`<a href="${m.website}" target="_blank" rel="noopener noreferrer" class="link-quiet">Website</a>`);
    if (m.youtube) acts.push(`<a href="${m.youtube}" target="_blank" rel="noopener noreferrer" class="link-quiet">YouTube</a>`);
    if (m.vimeo) acts.push(`<a href="${m.vimeo}" target="_blank" rel="noopener noreferrer" class="link-quiet">Vimeo</a>`);
    if (m.behance) acts.push(`<a href="${m.behance}" target="_blank" rel="noopener noreferrer" class="link-quiet">Behance</a>`);
    document.getElementById('hero-actions').innerHTML = acts.join('');

    const projects = m.projects || [];
    const stats = [`<div class="hero-stat"><p>${projects.length}</p><p>Projects</p></div>`];
    if (m.since) stats.push(`<div class="hero-stat"><p>${m.since}</p><p>With ARTISTTAAN Since</p></div>`);
    document.getElementById('hero-stats').innerHTML = stats.join('');

    document.getElementById('work-title').textContent = projects.length ? 'Selected Work' : 'Work';
    const playIconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="#16150f"><path d="M8 5v14l11-7z"/></svg>`;
    document.getElementById('projects-grid').innerHTML = projects.length
      ? projects.map(p => {
          const hasVideo = !!p.video;
          const wrapOpen = (!hasVideo && p.link) ? `<a class="project-card" href="${p.link}" target="_blank" rel="noopener noreferrer">` : `<div class="project-card">`;
          const wrapClose = (!hasVideo && p.link) ? `</a>` : `</div>`;
          return `
        ${wrapOpen}
          <div class="project-frame">
            <div class="vid-card${hasVideo ? '' : ' no-video'}" ${hasVideo ? `data-embed="${p.video}"` : ''}>
              <img class="vid-thumb" src="${assetPath(p.cover)}" alt="${p.title}" loading="lazy" />
              ${hasVideo ? `<div class="vid-play-btn">${playIconSvg}</div>` : ''}
            </div>
          </div>
          <div class="project-meta">
            <p class="project-title display">${p.title}</p>
            ${(p.role || p.year) ? `<p class="project-sub">${[p.role, p.year].filter(Boolean).join(' · ')}</p>` : ''}
            ${p.description ? `<p class="project-desc">${p.description}</p>` : ''}
            ${(!hasVideo && p.link) ? `<span class="project-link-cta">View Project
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
            </span>` : ''}
          </div>
        ${wrapClose}`;
        }).join('')
      : '<p class="empty-note">Projects coming soon.</p>';

    document.querySelectorAll('.vid-card[data-embed]').forEach(el => {
      el.addEventListener('click', () => {
        const embed = el.getAttribute('data-embed');
        const frame = el.closest('.project-frame');
        frame.innerHTML = `<iframe src="${embed}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      }, { once: true });
    });

    document.getElementById('about-title').textContent = m.name;
    document.getElementById('about-bio').textContent = m.full_bio || m.bio || '';
    document.getElementById('about-photo').src = assetPath(m.photo || m.cover);
    document.getElementById('about-photo').alt = m.name;
    if (m.location) {
      document.getElementById('about-location-row').style.display = 'flex';
      document.getElementById('about-location-text').textContent = m.location;
    }

    const plats = [];
    if (m.instagram) plats.push(`<a href="${m.instagram}" target="_blank" rel="noopener noreferrer" class="platform-link">Instagram</a>`);
    if (m.website) plats.push(`<a href="${m.website}" target="_blank" rel="noopener noreferrer" class="platform-link">Website</a>`);
    if (m.youtube) plats.push(`<a href="${m.youtube}" target="_blank" rel="noopener noreferrer" class="platform-link">YouTube</a>`);
    if (m.vimeo) plats.push(`<a href="${m.vimeo}" target="_blank" rel="noopener noreferrer" class="platform-link">Vimeo</a>`);
    if (m.behance) plats.push(`<a href="${m.behance}" target="_blank" rel="noopener noreferrer" class="platform-link">Behance</a>`);
    document.getElementById('platform-links').innerHTML = plats.join('');

    const gallery = m.gallery || [];
    document.getElementById('gallery-grid').innerHTML = gallery.map(g => `
      <div class="gallery-item"><img src="${assetPath(g)}" alt="${m.name}" loading="lazy" /></div>
    `).join('');
  }

  document.querySelectorAll('.idx').forEach(tab => {
    tab.addEventListener('click', () => {
      const el = document.getElementById(tab.dataset.target);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    });
  });
  const idxSections = ['work', 'about'];
  window.addEventListener('scroll', () => {
    let cur = 'work';
    idxSections.forEach(id => {
      const el = document.getElementById(id);
      if (el && window.scrollY >= el.offsetTop - 140) cur = id;
    });
    document.querySelectorAll('.idx').forEach(t => t.classList.toggle('active', t.dataset.target === cur));
  });

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
