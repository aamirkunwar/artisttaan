<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Team | ARTISTTAAN</title>
  <meta name="description" id="meta-description" content="" />
  <link rel="icon" type="image/png" href="/assets/images/logo/logo-icon.png" />
  <link rel="canonical" id="canonical-url" href="" />
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="ARTISTTAAN" />
  <meta property="og:url" id="og-url" content="" />
  <meta property="og:image" id="og-image" content="" />
  <meta property="og:title" id="og-title" content="" />
  <meta property="og:description" id="og-description" content="" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twitter-title" content="" />
  <meta name="twitter:description" id="twitter-description" content="" />
  <meta name="twitter:image" id="twitter-image" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper: #fafaf8;
      --paper-tint: #f2f0e9;
      --card: #ffffff;
      --ink: #16150f;
      --line: #e4e0d5;
      --mute: #8c8676;
      --gold: #a97a1f;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; }
    .display { font-family: 'Archivo Black', 'Inter', sans-serif; font-weight: 400; }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px;
      background: rgba(250, 250, 248, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo { height: 24px; width: auto; }
    .nav-back {
      font-size: 13px; font-weight: 500; text-decoration: none; color: var(--mute);
      display: flex; align-items: center; gap: 6px; transition: color 0.2s;
    }
    .nav-back:hover { color: var(--ink); }
    .nav-back svg { transition: transform 0.2s; }
    .nav-back:hover svg { transform: translateX(-3px); }

    /* ── COVER ── */
    .cover-banner {
      width: 100%; height: 320px; background: var(--paper-tint);
      background-image: linear-gradient(135deg, #efece2, #e4dfcf);
      overflow: hidden; position: relative;
    }
    .cover-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── LAYOUT ── */
    .profile-layout {
      max-width: 1320px; margin: -96px auto 0; padding: 0 48px 120px;
      position: relative; z-index: 2;
      display: grid; grid-template-columns: 320px 1fr; gap: 48px; align-items: start;
    }

    /* ── SIDEBAR CARD ── */
    .profile-card {
      background: var(--card); border: 1px solid var(--line);
      padding: 32px; position: sticky; top: 96px;
    }
    .profile-avatar {
      width: 112px; height: 112px; border-radius: 50%; overflow: hidden;
      border: 4px solid var(--card); box-shadow: 0 10px 28px rgba(0,0,0,0.16);
      background: #e5e2d8; margin-bottom: 24px;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-name { font-size: 24px; letter-spacing: -0.01em; margin-bottom: 6px; }
    .profile-pronouns { font-size: 13px; color: var(--mute); margin-bottom: 20px; }
    .profile-meta-row {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 13.5px; color: #46443c; margin-bottom: 14px; line-height: 1.5;
    }
    .profile-meta-row svg { flex-shrink: 0; margin-top: 2px; color: var(--mute); }
    .profile-meta-row a { text-decoration: none; word-break: break-word; }
    .profile-meta-row a:hover { color: var(--gold); }
    .profile-bio { font-size: 13.5px; line-height: 1.75; color: #5a5748; margin: 18px 0 4px; }
    .profile-links { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
    .profile-link-row {
      display: flex; align-items: center; gap: 10px;
      font-size: 13.5px; font-weight: 500; text-decoration: none; color: var(--ink);
      transition: color 0.2s;
    }
    .profile-link-row svg { flex-shrink: 0; color: var(--mute); transition: color 0.2s; }
    .profile-link-row:hover { color: var(--gold); }
    .profile-link-row:hover svg { color: var(--gold); }
    .profile-stats-row { display: flex; gap: 24px; margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); }
    .profile-stat p:first-child { font-family: 'Archivo Black'; font-size: 20px; letter-spacing: -0.01em; }
    .profile-stat p:last-child { font-size: 11.5px; color: var(--mute); margin-top: 4px; }

    /* ── PROJECTS ── */
    .projects-head {
      display: flex; align-items: center; gap: 14px; margin: 18px 0 28px;
    }
    .projects-count {
      display: inline-flex; align-items: center; padding: 7px 16px;
      background: var(--card); border: 1px solid var(--line);
      font-size: 12.5px; font-weight: 600; color: var(--mute);
    }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px 24px; }
    .project-card { display: block; text-decoration: none; color: var(--ink); }
    .project-thumb-wrap { position: relative; aspect-ratio: 16/9; overflow: hidden; background: #1a1a1a; }
    .project-thumb-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
    .vid-card { position: relative; width: 100%; height: 100%; cursor: pointer; overflow: hidden; background: #1a1a1a; }
    .vid-card.no-video { cursor: default; }
    .vid-thumb { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s cubic-bezier(0.16,1,0.3,1); }
    .vid-card:hover .vid-thumb { transform: scale(1.045); }
    .vid-play-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.88);
      width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.94);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: transform 0.25s, opacity 0.25s;
    }
    .vid-card:hover .vid-play-btn { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    .project-duration {
      position: absolute; right: 8px; bottom: 8px;
      background: rgba(0,0,0,0.78); color: #fff;
      font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
      padding: 3px 7px; border-radius: 3px;
    }
    .project-meta { margin-top: 14px; }
    .project-title { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.4; }
    .project-caption { font-size: 12.5px; color: var(--mute); margin-top: 5px; }

    /* ── ABOUT / GALLERY ── */
    .section-divider { border-top: 1px solid var(--line); margin: 72px 0 48px; }
    .sec-title { font-family: 'Archivo Black'; font-size: 22px; font-weight: 400; letter-spacing: -0.01em; margin-bottom: 24px; }
    .about-full-bio { font-size: 15px; line-height: 1.85; color: #46443c; max-width: 640px; white-space: pre-line; }
    .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 32px; }
    .gallery-item { aspect-ratio: 1; overflow: hidden; background: #e5e2d8; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; display: block; }
    .gallery-item:hover img { transform: scale(1.05); }
    .empty-note { font-size: 14px; color: var(--mute); }

    /* ── FOOTER ── */
    footer {
      background: var(--ink); color: #fff;
      padding: 48px; display: flex; align-items: center; justify-content: space-between;
    }
    footer p { font-size: 12px; color: #777; }
    footer a { font-size: 12px; color: #777; text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: #fff; }

    @media (max-width: 900px) {
      nav { padding: 0 24px; }
      .cover-banner { height: 200px; }
      .profile-layout { grid-template-columns: 1fr; margin-top: -64px; padding: 0 20px 80px; gap: 24px; }
      .profile-card { position: static; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      footer { flex-direction: column; gap: 12px; text-align: center; padding: 36px 24px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/"><img class="nav-logo" src="/assets/images/logo/logo-nav.png" alt="ARTISTTAAN" /></a>
  <a href="/team/" class="nav-back">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Our Team
  </a>
</nav>

<div class="cover-banner">
  <img id="cover-img" src="" alt="" style="display:none;" />
</div>

<div class="profile-layout">

  <aside class="profile-card">
    <div class="profile-avatar"><img id="profile-avatar" src="" alt="" /></div>
    <h1 class="profile-name display" id="hero-name"></h1>
    <p class="profile-pronouns" id="profile-pronouns" style="display:none;"></p>

    <div class="profile-meta-row" id="profile-location-row" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-7-6.1-7-11a7 7 0 1114 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="profile-location-text"></span>
    </div>
    <div class="profile-meta-row" id="profile-role-row" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7h-4V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v3H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2zM10 4h4v3h-4z"/></svg>
      <span id="profile-role-text"></span>
    </div>
    <div class="profile-meta-row" id="profile-email-row" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4h16v16H4V4zm0 0l8 9 8-9"/></svg>
      <a id="profile-email-text" href=""></a>
    </div>

    <p class="profile-bio" id="profile-bio"></p>

    <div class="profile-links" id="profile-links"></div>
    <div class="profile-stats-row" id="profile-stats"></div>
  </aside>

  <div>
    <div class="projects-head">
      <span class="projects-count" id="projects-count">0 Projects</span>
    </div>
    <div class="projects-grid" id="projects-grid"></div>

    <div id="about-block" style="display:none;">
      <div class="section-divider"></div>
      <h2 class="sec-title display">About</h2>
      <p class="about-full-bio" id="about-full-bio"></p>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </div>

</div>

<footer>
  <p>© 2026 ARTISTTAAN</p>
  <a href="/">← Back to ARTISTTAAN</a>
</footer>

<script>
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const pathSlug = (pathParts[0] === 'team' && pathParts[1]) ? pathParts[1] : null;
  const memberId = new URLSearchParams(window.location.search).get('member') || pathSlug;

  function assetPath(p) {
    if (!p) return '';
    return '/' + String(p).replace(/^\/+/, '');
  }

  // Pulls the 11-character video ID out of any common YouTube URL format --
  // an /embed/ link, a normal /watch?v= link, a youtu.be short link, or a
  // /shorts/ link -- so people can just paste whatever link YouTube gave
  // them rather than needing to know the /embed/ format specifically.
  function extractYouTubeId(url) {
    if (!url) return null;
    const patterns = [
      /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/watch\?(?:.*&)?v=([a-zA-Z0-9_-]{11})/,
      /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
      /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    ];
    for (const re of patterns) {
      const m = url.match(re);
      if (m) return m[1];
    }
    return null;
  }

  async function init() {
    try {
      const res = await fetch('/assets/data/artists.json');
      const data = await res.json();
      const member = (data.team || []).find(m => m.id === memberId);
      if (!member) { document.body.innerHTML = '<p style="text-align:center;padding:160px 20px;font-size:14px;color:#8c8676;">Team member not found.</p>'; return; }
      render(member);
    } catch (e) { console.error(e); }
  }

  function render(m) {
    document.getElementById('page-title').textContent = `${m.name} — ARTISTTAAN`;
    document.getElementById('meta-description').content = m.full_bio || m.bio || '';
    document.getElementById('og-title').content = `${m.name} | ARTISTTAAN`;
    document.getElementById('og-description').content = m.bio || '';
    document.getElementById('og-url').content = `https://artisttaanmusic.com/team/${m.id}/`;
    document.getElementById('canonical-url').href = `https://artisttaanmusic.com/team/${m.id}/`;
    document.getElementById('twitter-title').content = `${m.name} | ARTISTTAAN`;
    document.getElementById('twitter-description').content = m.bio || '';
    const heroImage = m.cover || m.photo;
    if (heroImage) {
      document.getElementById('og-image').content = `https://artisttaanmusic.com${assetPath(heroImage)}`;
      document.getElementById('twitter-image').content = `https://artisttaanmusic.com${assetPath(heroImage)}`;
    }

    // Cover banner -- falls back to the plain tinted background (set in CSS)
    // if no cover image is set.
    if (m.cover) {
      const coverImg = document.getElementById('cover-img');
      coverImg.src = assetPath(m.cover);
      coverImg.alt = m.name;
      coverImg.style.display = 'block';
    }

    document.getElementById('profile-avatar').src = assetPath(m.photo || m.cover);
    document.getElementById('profile-avatar').alt = m.name;
    document.getElementById('hero-name').textContent = m.name;

    if (m.pronouns) {
      document.getElementById('profile-pronouns').style.display = 'block';
      document.getElementById('profile-pronouns').textContent = m.pronouns;
    }
    if (m.location) {
      document.getElementById('profile-location-row').style.display = 'flex';
      document.getElementById('profile-location-text').textContent = m.location;
    }
    if (m.role) {
      document.getElementById('profile-role-row').style.display = 'flex';
      document.getElementById('profile-role-text').textContent = m.role;
    }
    if (m.email) {
      document.getElementById('profile-email-row').style.display = 'flex';
      const emailEl = document.getElementById('profile-email-text');
      emailEl.href = `mailto:${m.email}`;
      emailEl.textContent = m.email;
    }

    document.getElementById('profile-bio').textContent = m.bio || '';

    const linkIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 13a5 5 0 007.07 0l2.83-2.83a5 5 0 00-7.07-7.07L11.5 4.5M14 11a5 5 0 00-7.07 0L4.1 13.83a5 5 0 007.07 7.07L12.5 19.5"/></svg>`;
    const links = [
      m.instagram ? { label: m.instagram_handle || 'Instagram', url: m.instagram } : null,
      m.website ? { label: 'Website', url: m.website } : null,
      m.youtube ? { label: 'YouTube', url: m.youtube } : null,
      m.vimeo ? { label: 'Vimeo', url: m.vimeo } : null,
      m.behance ? { label: 'Behance', url: m.behance } : null,
    ].filter(Boolean);
    document.getElementById('profile-links').innerHTML = links.map(l => `
      <a class="profile-link-row" href="${l.url}" target="_blank" rel="noopener noreferrer">${linkIcon}${l.label}</a>
    `).join('');

    const projects = m.projects || [];
    const stats = [`<div class="profile-stat"><p>${projects.length}</p><p>Projects</p></div>`];
    if (m.since) stats.push(`<div class="profile-stat"><p>${m.since}</p><p>Since</p></div>`);
    document.getElementById('profile-stats').innerHTML = stats.join('');

    document.getElementById('projects-count').textContent = `${projects.length} Project${projects.length === 1 ? '' : 's'}`;
    const playIconSvg = `<svg width="16" height="16" viewBox="0 0 24 24" fill="#16150f"><path d="M8 5v14l11-7z"/></svg>`;
    document.getElementById('projects-grid').innerHTML = projects.length
      ? projects.map(p => {
          const hasVideo = !!p.video;
          // If it's a recognizable YouTube link (embed, watch, youtu.be, or
          // shorts -- in any order/format someone might paste), pull the
          // real thumbnail straight from YouTube and normalize the URL to a
          // proper /embed/ link for playback, instead of requiring a
          // manually uploaded Thumbnail Image. A manually set Thumbnail
          // Image always wins if one is provided (e.g. to use a custom
          // crop), and non-YouTube video links (Vimeo, etc.) still need a
          // manual thumbnail since there's no universal way to fetch those.
          const ytId = hasVideo ? extractYouTubeId(p.video) : null;
          const embedSrc = ytId ? `https://www.youtube.com/embed/${ytId}` : p.video;
          const thumbSrc = p.cover ? assetPath(p.cover) : (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '');
          const wrapOpen = (!hasVideo && p.link) ? `<a class="project-card" href="${p.link}" target="_blank" rel="noopener noreferrer">` : `<div class="project-card">`;
          const wrapClose = (!hasVideo && p.link) ? `</a>` : `</div>`;
          const caption = [p.role, p.year].filter(Boolean).join(' · ');
          return `
        ${wrapOpen}
          <div class="project-thumb-wrap">
            <div class="vid-card${hasVideo ? '' : ' no-video'}" ${hasVideo ? `data-embed="${embedSrc}"` : ''}>
              ${thumbSrc ? `<img class="vid-thumb" src="${thumbSrc}" alt="${p.title}" loading="lazy" />` : ''}
              ${hasVideo ? `<div class="vid-play-btn">${playIconSvg}</div>` : ''}
              ${p.duration ? `<span class="project-duration">${p.duration}</span>` : ''}
            </div>
          </div>
          <div class="project-meta">
            <p class="project-title">${p.title}</p>
            ${caption ? `<p class="project-caption">${caption}</p>` : ''}
          </div>
        ${wrapClose}`;
        }).join('')
      : '<p class="empty-note">Projects coming soon.</p>';

    document.querySelectorAll('.vid-card[data-embed]').forEach(el => {
      el.addEventListener('click', () => {
        const embed = el.getAttribute('data-embed');
        const frame = el.closest('.project-thumb-wrap');
        frame.innerHTML = `<iframe src="${embed}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      }, { once: true });
    });

    const fullBio = m.full_bio || '';
    const gallery = m.gallery || [];
    if (fullBio || gallery.length) {
      document.getElementById('about-block').style.display = 'block';
      document.getElementById('about-full-bio').textContent = fullBio;
      document.getElementById('gallery-grid').innerHTML = gallery.map(g => `
        <div class="gallery-item"><img src="${assetPath(g)}" alt="${m.name}" loading="lazy" /></div>
      `).join('');
    }
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
